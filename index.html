<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poki Hacked Games 🎮</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    background: radial-gradient(circle at 20% 20%, #1b2a4a, #0a0f1c 60%);
    color: #fff;
    padding: 2rem;
    overflow: hidden;
  }

  /* animated glow blobs */
  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 45vmax;
    height: 45vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: -1;
    animation: float 12s ease-in-out infinite alternate;
  }
  body::before { background: #ff3d81; top: -15vmax; left: -15vmax; }
  body::after  { background: #00e0ff; bottom: -15vmax; right: -15vmax; animation-delay: -6s; }

  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, 4vmax) scale(1.15); }
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff3d81, #ffd166, #00e0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 61, 129, 0.35);
  }

  .subtitle {
    margin-top: -1.5rem;
    font-size: 1rem;
    color: #8ba0c4;
    letter-spacing: 1px;
    text-align: center;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
  }

  .btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    width: 260px;
    height: 150px;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.25s ease;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
  }

  .btn .emoji { font-size: 2.2rem; line-height: 1; }
  .btn .tag {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0.8;
    text-transform: none;
  }

  .btn-drive {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    box-shadow: 0 12px 30px rgba(221, 36, 118, 0.45);
  }

  .btn-plonky {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    box-shadow: 0 12px 30px rgba(0, 114, 255, 0.45);
  }

  .btn:hover {
    transform: translateY(-8px) scale(1.04);
    filter: brightness(1.12);
  }

  .btn-drive:hover { box-shadow: 0 20px 45px rgba(221, 36, 118, 0.7); }
  .btn-plonky:hover { box-shadow: 0 20px 45px rgba(0, 114, 255, 0.7); }

  .btn:active { transform: translateY(-2px) scale(0.98); }

  footer {
    font-size: 0.75rem;
    color: #4c5c7a;
    letter-spacing: 1px;
    text-align: center;
  }

  @media (max-width: 620px) {
    .btn { width: 100%; max-width: 320px; height: 130px; }
    .buttons { width: 100%; }
  }
</style>
</head>
<body>

  <h1>Poki Hacked 🚀</h1>
  <p class="subtitle">pick your game, let's go</p>

  <div class="buttons">
    <a class="btn btn-drive" href="https://danielmulderpro.github.io/poki-games/drivemad/index.html" target="_blank" rel="noopener">
      <span class="emoji">🚗</span>
      Play Drive Mad
      <span class="tag">hacked edition lol</span>
    </a>

    <a class="btn btn-plonky" href="https://danielmulderpro.github.io/poki-games/pl%3Bonkuy/index.html" target="_blank" rel="noopener">
      <span class="emoji">🧩</span>
      Play Plonky
      <span class="tag">hacked edition lol</span>
    </a>
  </div>

  <footer>opens in a new tab · not affiliated with Poki</footer>

</body>
</html>
